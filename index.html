<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5000">
<title>iPhone 17 Pro Max — 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Theme tokens. Dark is the default; [data-theme="light"] overrides. ── */
  :root {
    --theme-dur: 240ms;      /* UI colour changes */
    --bg-dur: 850ms;         /* backdrop cross-fade between modes */
    --zoommer: #ff5000;      /* official Zoommer orange (brand logo SVG) */
    --fg: #ecedf0;
    --muted: rgba(236, 237, 240, 0.55);
    --panel: rgba(30, 32, 37, 0.58);
    --line: rgba(255, 255, 255, 0.09);
    --accent: #8fb0ff;
    /* Shared glass material (control bar + theme switch) */
    --glass-bg: rgba(26, 28, 33, 0.52);
    --glass-border: rgba(255, 255, 255, 0.13);
    --glass-filter: blur(20px) saturate(150%);
    --glass-shadow: 0 12px 36px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --ctl-icon: rgba(236, 237, 240, 0.62);
    --ctl-icon-hover: #f4f5f7;
    --ctl-hover-bg: rgba(255, 255, 255, 0.08);
    --ctl-active-bg: #eceef2;
    --ctl-active-icon: #15171c;
    --ctl-active-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    --sep: rgba(255, 255, 255, 0.16);
    /* Zoom slider */
    --track: rgba(255, 255, 255, 0.12);
    --tick: rgba(255, 255, 255, 0.2);
    --tick-zero: rgba(255, 255, 255, 0.55);
    --num: rgba(255, 255, 255, 0.035);
    --num-active: rgba(255, 255, 255, 0.06);
    --swatch-border: rgba(255, 255, 255, 0.25);
    --ring-gap: #121316;
    --ring: rgba(255, 255, 255, 0.85);
    --spinner: rgba(255, 255, 255, 0.85);
    --spinner-track: rgba(255, 255, 255, 0.14);
    --page-bg:
      radial-gradient(60% 45% at 50% 42%, rgba(120, 130, 155, 0.16) 0%, rgba(0, 0, 0, 0) 70%),
      radial-gradient(130% 95% at 50% 40%, #2a2c31 0%, #18191c 50%, #0b0c0e 100%);
    --page-bg-light:
      radial-gradient(60% 45% at 50% 42%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 70%),
      radial-gradient(130% 95% at 50% 40%, #f5f6f8 0%, #e5e7eb 55%, #d3d6dc 100%);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --fg: #1b1d22;
    --muted: rgba(27, 29, 34, 0.55);
    --panel: rgba(255, 255, 255, 0.5);
    --line: rgba(20, 22, 28, 0.08);
    --accent: #3d6bff;
    --glass-bg: rgba(255, 255, 255, 0.5);
    --glass-border: rgba(255, 255, 255, 0.8);
    --glass-shadow: 0 12px 36px rgba(28, 34, 48, 0.16), 0 0 0 0.5px rgba(20, 22, 28, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    --ctl-icon: rgba(28, 30, 36, 0.58);
    --ctl-icon-hover: #14161b;
    --ctl-hover-bg: rgba(20, 22, 28, 0.06);
    --ctl-active-bg: #ffffff;
    --ctl-active-icon: #15171c;
    --ctl-active-shadow: 0 2px 10px rgba(28, 34, 48, 0.18);
    --sep: rgba(20, 22, 28, 0.12);
    --track: rgba(20, 22, 28, 0.1);
    --tick: rgba(20, 22, 28, 0.22);
    --tick-zero: rgba(20, 22, 28, 0.6);
    --num: rgba(20, 22, 28, 0.045);
    --num-active: rgba(20, 22, 28, 0.07);
    --swatch-border: rgba(20, 22, 28, 0.18);
    --ring-gap: #eceef1;
    --ring: rgba(20, 22, 28, 0.7);
    --spinner: rgba(20, 22, 28, 0.75);
    --spinner-track: rgba(20, 22, 28, 0.12);
    color-scheme: light;
  }
  :root[data-theme="zoommer"] {
    --fg: #ffffff;
    --muted: rgba(255, 255, 255, 0.8);
    --panel: rgba(112, 34, 0, 0.24);
    --line: rgba(255, 255, 255, 0.2);
    --accent: #ffffff;
    --glass-bg: rgba(96, 28, 0, 0.34);
    --glass-border: rgba(255, 255, 255, 0.3);
    --glass-shadow: 0 14px 40px rgba(96, 26, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    --ctl-icon: rgba(255, 255, 255, 0.9);
    --ctl-icon-hover: #ffffff;
    --ctl-hover-bg: rgba(255, 255, 255, 0.14);
    --ctl-active-bg: #ffffff;
    --ctl-active-icon: #1c1d21;
    --ctl-active-shadow: 0 3px 12px rgba(110, 30, 0, 0.3);
    --sep: rgba(255, 255, 255, 0.32);
    --track: rgba(255, 255, 255, 0.26);
    --tick: rgba(255, 255, 255, 0.45);
    --tick-zero: #ffffff;
    --num: rgba(255, 255, 255, 0.07);
    --num-active: rgba(255, 255, 255, 0.11);
    --swatch-border: rgba(255, 255, 255, 0.55);
    --ring-gap: #ff5a12;
    --ring: #ffffff;
    --spinner: #ffffff;
    --spinner-track: rgba(255, 255, 255, 0.3);
    color-scheme: dark;
  }
  /* On orange the slider's orange fill would vanish — switch it to white. */
  :root[data-theme="zoommer"] .zoom { --accent-a: #ffffff; --accent-b: #ffe6d6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: var(--fg);
    background: var(--page-bg);
    background-color: #121316;
    font-family: "Noto Sans Georgian", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
    transition: color var(--theme-dur) ease;
  }
  /* Mode backdrops cross-fade over the dark base (gradients themselves can't be transitioned). */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: var(--page-bg-light);
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
  }
  :root[data-theme="light"] body::before { opacity: 1; }

  /* Zoommer studio: orange cyclorama — deep edges, soft centre light, broad overhead beam,
     lit floor and a light haze. Pure gradients (no filters) so it stays cheap on phones. */
  .zenv {
    position: fixed; inset: -3%; z-index: -1;
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
    overflow: hidden;
  }
  :root[data-theme="zoommer"] .zenv { opacity: 1; }

  /* Zoommer brand typography: a flat white HTML/SVG layer *behind* the transparent WebGL canvas.
     The phone therefore always covers it, can never intersect it in 3D, and it never moves with the model.
     Sizes / positions are set in px by layoutBrand() on resize only. */
  .ztype {
    position: fixed; inset: 0; z-index: -1;
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
    color: #ffffff;
    contain: strict;
  }
  :root[data-theme="zoommer"] .ztype { opacity: 1; }
  .ztype > * { position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); }
  .zt-line {
    display: flex; align-items: center;
    white-space: nowrap;
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    font-weight: 500;
    letter-spacing: -0.012em;
    line-height: 1;
    font-size: 100px;
  }
  /* Apple mark: about cap height + leaf, nudged so its body sits on the text's optical centre. */
  .zt-apple { width: 0.64em; height: 0.8em; margin-right: 0.16em; fill: currentColor; transform: translateY(-0.05em); flex: none; }
  .zt-pro, .zt-word { display: block; fill: #ffffff; overflow: visible; }
  /* When the big words pass behind the zoom slider (narrow screens), back it with the bar's glass. */
  .zoom::before {
    content: ""; position: absolute; inset: 6px -6px; z-index: -1;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    box-shadow: var(--glass-shadow);
    opacity: 0;
    transition: opacity var(--bg-dur) ease;
    pointer-events: none;
  }
  :root[data-theme="zoommer"].zt-under-slider .zoom::before { opacity: 1; }
  .zenv > i { position: absolute; display: block; }
  .zenv .z-base {
    inset: 0;
    background: radial-gradient(120% 95% at 50% 40%, #ff8538 0%, #ff5000 36%, #d84300 66%, #8c2900 100%);
  }
  .zenv .z-glow {
    inset: 0;
    background: radial-gradient(44% 40% at 50% 40%, rgba(255, 200, 156, 0.55) 0%, rgba(255, 164, 104, 0.18) 45%, rgba(255, 120, 60, 0) 75%);
    transform: translate3d(calc(var(--px, 0) * 8px), calc(var(--py, 0) * 6px), 0);
  }
  .zenv .z-beam {
    left: 50%; top: -14%;
    width: 72vmax; height: 96vh; margin-left: -36vmax;
    background: radial-gradient(50% 100% at 50% 0%, rgba(255, 242, 230, 0.34) 0%, rgba(255, 226, 202, 0.12) 42%, rgba(255, 210, 180, 0) 72%);
    transform: translate3d(calc(var(--px, 0) * 20px), calc(var(--py, 0) * 10px), 0);
  }
  .zenv .z-floor {
    left: -8%; right: -8%; bottom: 0; height: 48%;
    background:
      radial-gradient(60% 40% at 50% 44%, rgba(255, 216, 184, 0.46) 0%, rgba(255, 172, 122, 0.16) 46%, rgba(255, 120, 60, 0) 76%),
      linear-gradient(180deg, rgba(255, 120, 50, 0) 0%, rgba(118, 32, 0, 0.3) 100%);
    transform: translate3d(calc(var(--px, 0) * -14px), calc(var(--py, 0) * -5px), 0);
  }
  .zenv .z-fog {
    inset: 0;
    background: radial-gradient(85% 55% at 50% 64%, rgba(255, 234, 216, 0.16) 0%, rgba(255, 234, 216, 0) 70%);
    transform: translate3d(calc(var(--px, 0) * 5px), 0, 0);
  }
  /* Same glass material for every floating control surface. */
  .glass {
    height: 56px;
    padding: 8px;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: var(--glass-filter);
    -webkit-backdrop-filter: var(--glass-filter);
    box-shadow: var(--glass-shadow);
    transition: background-color var(--theme-dur) ease, border-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
  }
  #c {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
    outline: none;
  }
  #c.dragging { cursor: grabbing; }

  header {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    left: max(22px, env(safe-area-inset-left));
    pointer-events: none;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
  header p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

  .swatches {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(22px, env(safe-area-inset-right));
    display: flex; gap: 10px; padding: 7px 9px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
  }
  .swatches button {
    width: 20px; height: 20px; padding: 0;
    border-radius: 50%;
    border: 1px solid var(--swatch-border);
    background: var(--sw);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .swatches button:hover { transform: scale(1.1); }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ring-gap), 0 0 0 3.5px var(--ring); }

  /* ── Control bar: glass capsule, one row of 40 × 40 icon buttons ── */
  .dock {
    position: fixed;
    z-index: 5;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    width: max-content;
    max-width: calc(100vw - 24px);
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    touch-action: pan-x;
  }
  .dock::-webkit-scrollbar { display: none; }
  .dock .group { position: relative; display: flex; align-items: center; gap: 6px; flex: none; }
  .dock button {
    position: relative; z-index: 1;
    flex: none;
    display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0;
    appearance: none;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--ctl-icon);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
  }
  .dock button svg {
    width: 21px; height: 21px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  .dock button:hover { color: var(--ctl-icon-hover); background: var(--ctl-hover-bg); }
  .dock button:active { transform: scale(0.94); }
  /* Selected state: light pill, dark icon */
  .dock button.active,
  .dock button[aria-pressed="true"] { color: var(--ctl-active-icon); background: transparent; }
  .dock button.active:hover { color: var(--ctl-active-icon); background: transparent; }
  .dock #auto[aria-pressed="true"],
  .dock #auto[aria-pressed="true"]:hover { color: var(--ctl-active-icon); background: var(--ctl-active-bg); box-shadow: var(--ctl-active-shadow); }
  /* Segmented control: one light indicator slides between the mutually exclusive views */
  .dock .seg-ind {
    position: absolute; left: 0; top: 0; z-index: 0;
    width: 40px; height: 40px;
    border-radius: 999px;
    background: var(--ctl-active-bg);
    box-shadow: var(--ctl-active-shadow);
    opacity: 0;
    transition: transform 0.2s cubic-bezier(0.3, 0.7, 0.2, 1), opacity 0.18s ease, background-color var(--theme-dur) ease;
    pointer-events: none;
  }
  .dock .seg-ind.show { opacity: 1; }
  .dock .sep { flex: none; width: 1px; height: 24px; margin: 0 2px; background: var(--sep); }

  /* ── Theme switch: Light / Dark / Zoommer. Same glass capsule as the bar (shared .glass);
        three equal 40 px slots and one 40 px knob sliding between them. 136 = 2 × (1 border + 7) + 3 × 40 ── */
  .theme-toggle {
    position: fixed; z-index: 5; left: 0; top: 0;
    display: flex; align-items: center;
    width: 136px;
    padding: 7px;                  /* + 1 px border = 8 px from the outer edge, like the bar */
    visibility: hidden;            /* shown once JS has measured where it goes */
  }
  .theme-toggle.placed { visibility: visible; }
  .theme-toggle .tt-knob {
    position: absolute; left: 7px; top: 7px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--ctl-active-bg);
    box-shadow: var(--ctl-active-shadow);
    transform: translateX(calc(var(--i, 1) * 40px));
    transition: transform 260ms cubic-bezier(0.3, 0.7, 0.2, 1), background-color var(--theme-dur) ease, box-shadow var(--theme-dur) ease;
    pointer-events: none;
  }
  .theme-toggle button {
    position: relative; z-index: 1;
    flex: none;
    display: grid; place-items: center;
    width: 40px; height: 40px; padding: 0; margin: 0;
    appearance: none; border: 0; border-radius: 50%;
    background: transparent;
    color: var(--ctl-icon);
    cursor: pointer;
    touch-action: manipulation;
    transition: color 0.2s ease, background-color 0.18s ease, transform 0.18s ease;
  }
  .theme-toggle button:hover { color: var(--ctl-icon-hover); background: var(--ctl-hover-bg); }
  .theme-toggle button[aria-checked="true"],
  .theme-toggle button[aria-checked="true"]:hover { color: var(--ctl-active-icon); background: transparent; }
  .theme-toggle button:active { transform: scale(0.92); }
  .theme-toggle button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .theme-toggle svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  /* The filled, circular emblem reads heavier than line icons — 19 px matches their visual weight. */
  .theme-toggle svg.zm { width: 19px; height: 19px; fill: currentColor; stroke: none; }
  @media (prefers-reduced-motion: reduce) {
    .theme-toggle .tt-knob { transition-duration: 0.01ms; }
    .zenv, .ztype, body::before { transition-duration: 200ms; }
  }
  :root.theme-stacked .hint { bottom: calc(160px + env(safe-area-inset-bottom)); }
  .dock button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .tip {
    position: fixed; z-index: 30; left: 0; top: 0;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(20, 21, 25, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #f1f2f4;
    font-size: 12px; line-height: 1.2;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transform: translate(-50%, calc(-100% + 4px));
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .tip.show { opacity: 1; transform: translate(-50%, -100%); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .hint {
    position: fixed; left: 50%;
    bottom: calc(94px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    font-size: 12px; color: var(--muted);
    width: max-content;
    max-width: calc(100vw - 32px);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.8s;
  }
  .hint.gone { opacity: 0; }

  #loader, #error {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px; text-align: center;
    background: var(--page-bg);
    transition: opacity 0.7s;
  }
  :root[data-theme="light"] #loader, :root[data-theme="light"] #error { background: var(--page-bg-light); }
  :root[data-theme="zoommer"] #loader, :root[data-theme="zoommer"] #error { background: radial-gradient(120% 95% at 50% 40%, #ff8538 0%, #ff5000 40%, #b33800 100%); }
  #loader.done { opacity: 0; pointer-events: none; }
  .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 2.5px solid var(--spinner-track);
    border-top-color: var(--spinner);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loader-text { font-size: 13px; color: var(--muted); }
  #error[hidden] { display: none; }
  #error h2 { margin: 0; font-size: 18px; font-weight: 600; }
  #error p { margin: 0; max-width: 460px; font-size: 14px; line-height: 1.6; color: var(--muted); }

  /* ── Zoom slider (−3 … +3) ── */
  .zoom {
    --pad: 36px;
    --accent-a: #ff9a5c;
    --accent-b: #ee5a2a;
    position: fixed;
    right: max(26px, env(safe-area-inset-right));
    top: 50%;
    transform: translateY(-50%);
    width: 67px; height: clamp(190px, calc(100vh - 210px), 320px);
    user-select: none;
  }
  .zoom-num {
    position: absolute; right: 2px; top: 50%;
    transform: translateY(-56%);
    font-size: clamp(84px, 16vh, 132px); font-weight: 300; line-height: 1;
    letter-spacing: -0.04em;
    color: var(--num);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
    white-space: nowrap;
    transition: color 0.3s;
  }
  .zoom.active .zoom-num { color: var(--num-active); }
  .zoom-ticks { position: absolute; left: 2px; top: var(--pad); bottom: var(--pad); width: 12px; pointer-events: none; }
  .zoom-ticks i {
    position: absolute; left: 0; height: 2px; width: 6px; margin-top: -1px;
    border-radius: 1px;
    background: var(--tick);
    transition: background 0.15s;
  }
  .zoom-ticks i.major { width: 11px; }
  .zoom-ticks i.on { background: var(--accent-b); }
  .zoom-ticks i.zero { background: var(--tick-zero); }
  .zoom-hit {
    position: absolute; left: 14px; width: 36px;
    top: var(--pad); bottom: var(--pad);
    cursor: pointer;
    touch-action: none;
    outline: none;
  }
  .zoom-track {
    position: absolute; left: 50%; top: 0; bottom: 0;
    width: 8px; margin-left: -4px;
    border-radius: 6px;
    background: var(--track);
    box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
  }
  .zoom-fill {
    position: absolute; left: 0; right: 0; top: 50%; height: 0;
    border-radius: 6px;
    background: linear-gradient(180deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 0 12px rgba(238, 90, 42, 0.35);
  }
  .zoom-thumb {
    position: absolute; left: 50%; top: 50%;
    width: 28px; height: 52px;
    transform: translate(-50%, -50%);
    border-radius: 14px;
    background: linear-gradient(155deg, #fbfbfc 0%, #e4e6ea 55%, #cfd2d8 100%);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.9) inset, 0 -2px 4px rgba(0, 0, 0, 0.08) inset;
    cursor: grab;
    transition: box-shadow 0.2s;
  }
  .zoom-thumb::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 12px; height: 12px; margin: -6px 0 0 -6px;
    border-radius: 50%;
    background: linear-gradient(160deg, #eef0f3, #dcdfe4);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.15) inset;
  }
  .zoom.active .zoom-thumb { cursor: grabbing; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 0 4px rgba(238, 90, 42, 0.25), 0 1px 0 rgba(255, 255, 255, 0.9) inset; }

  function rrect4(w, h, tl, tr, br, bl) {

    s.lineTo(x1, y1 - tr);
    s.absarc(x1 - tr, y1 - tr, tr, 0, Math.PI / 2, false);

    s.absarc(x0 + tl, y1 - tl, tl, Math.PI / 2, Math.PI, false);

  function placeThemeToggle() {
    const bar = dockEl.getBoundingClientRect();
    const zr = zoomBox.getBoundingClientRect();
    const w = themeBtn.offsetWidth, h = themeBtn.offsetHeight;
    const gap = zr.left - bar.right;
    let left, top;
    const stacked = gap < w + 24;
    if (!stacked) {
      left = bar.right + (gap - w) / 2;
      top = bar.top + (bar.height - h) / 2;
    } else {
      left = (window.innerWidth - w) / 2;
      top = bar.top - 12 - h;
    }
    themeBtn.style.left = left + 'px';
    themeBtn.style.top = top + 'px';
    document.documentElement.classList.toggle('theme-stacked', stacked);
    themeBtn.classList.add('placed');
  }
  // ── Zoommer typography layout (px), from the work area. Desktop targets: PRO ≈ 67 % of the width,
  // zoommer wordmark exactly as wide as PRO's ink and centred on the screen's vertical middle; "iPhone 17" row ≈ 43 %
  // of that width. PRO (≈ 29 %) and the top line (≈ 10 %) move up only if needed to keep clear gaps.
  const ztLine = document.getElementById('zt-line');
  const ztPro = document.getElementById('zt-pro');
  const ztWord = document.getElementById('zt-word');
  // Both SVGs' viewBoxes are their ink boxes (stroke included), so equal element widths = equal visible widths.
  const WORD_ASPECT = ztWord.viewBox.baseVal.height / ztWord.viewBox.baseVal.width;
  const PRO_ASPECT = 200 / 1000;                       // PRO's viewBox is already its ink box
  let lineWidthPer100 = 0;
  function measureLine() {
    ztLine.style.fontSize = '100px';
    lineWidthPer100 = ztLine.getBoundingClientRect().width;
  }
  function layoutBrand() {
    if (!lineWidthPer100) measureLine();
    const vw = window.innerWidth;
    const wa = workArea();
    const cx = vw / 2;
    const zr = zoomBox.getBoundingClientRect();
    const clearOfSlider = 2 * (zr.left - 12 - cx);     // widest a centred row can be without reaching the zoom slider
    let w = 0.67 * vw;
    const ratios = [0.10, 0.29, 0.50];
    let underSlider = false;
    if (w > clearOfSlider) {
      if (clearOfSlider >= 0.6 * vw) w = clearOfSlider;
      // Narrow screens: keep the words wide enough to show beside the phone; they pass behind the slider,
      // which then gets a glass backing (CSS .zt-under-slider) so it stays legible.
      else { w = 0.84 * vw; underSlider = true; }
    }
    let c0, c1, c2, lineH, proH, wordH, fs;
    for (let i = 0; i < 14; i++) {
      proH = w * PRO_ASPECT;
      wordH = w * WORD_ASPECT;
      fs = (0.43 * w) / lineWidthPer100 * 100;
      lineH = fs * 0.78;
      const gap = Math.max(8, 0.03 * w);
      c2 = Math.min(window.innerHeight / 2, wa.bottom - 8 - wordH / 2);    // wordmark: middle of the screen
      c1 = Math.min(wa.top + ratios[1] * wa.height, c2 - wordH / 2 - gap - proH / 2);
      c0 = Math.min(wa.top + ratios[0] * wa.height, c1 - proH / 2 - gap - lineH / 2);
      if (c0 - lineH / 2 >= wa.top + 6) break;
      w *= 0.95;
    }
    document.documentElement.classList.toggle('zt-under-slider', underSlider);
    ztLine.style.fontSize = fs.toFixed(2) + 'px';
    ztLine.style.top = c0.toFixed(1) + 'px';
    ztPro.style.width = w.toFixed(1) + 'px';
    ztPro.style.height = proH.toFixed(1) + 'px';
    ztPro.style.top = c1.toFixed(1) + 'px';
    ztWord.style.width = w.toFixed(1) + 'px';
    ztWord.style.height = wordH.toFixed(1) + 'px';
    ztWord.style.top = c2.toFixed(1) + 'px';
  }
  function relayout() {
    placeThemeToggle();
    layoutBrand();
    frameCamera();
  }
  relayout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lineWidthPer100 = 0; relayout(); });

  window.addEventListener('resize', () => {
    hideTip();
    setActive(viewBtns.find(b => b.classList.contains('active'))?.dataset.view ?? null);
    relayout();
  });

  // ── Zoom slider: level −3 (farthest) … 0 (default framing) … +3 (closest).
  // Level ↔ zoom factor is exponential, so each step feels the same; it stays in sync with wheel / pinch / keys.
  const LEVEL_MAX = 3;
  const zoomFromLevel = (v) => (v >= 0 ? Math.pow(ZOOM_MIN, v / LEVEL_MAX) : Math.pow(ZOOM_MAX, -v / LEVEL_MAX));
  const levelFromZoom = (z) => (z <= 1 ? LEVEL_MAX * Math.log(z) / Math.log(ZOOM_MIN) : -LEVEL_MAX * Math.log(z) / Math.log(ZOOM_MAX));
  const zoomEl = document.getElementById('zoom');
  const zoomHit = document.getElementById('zoom-hit');
  const zoomThumb = document.getElementById('zoom-thumb');
  const zoomFill = document.getElementById('zoom-fill');
  const zoomNum = document.getElementById('zoom-num');
  const ticksEl = document.getElementById('zoom-ticks');
  const ticks = [];
  for (let i = 0; i <= 24; i++) {
    const v = LEVEL_MAX - i * 0.25;
    const t = document.createElement('i');
    if (Number.isInteger(v)) t.classList.add('major');
    if (v === 0) t.classList.add('zero');
    t.style.top = (i / 24 * 100) + '%';
    ticksEl.appendChild(t);
    ticks.push({ el: t, v });
  }
  const fmtLevel = (v) => {
    const r = Math.round(v * 100) / 100;
    if (Math.abs(r) < 0.005) return '0';
    const s = String(Math.abs(r));
    return (r > 0 ? '+' : '−') + s;
  };
  let shownLevel = NaN;
  function renderZoomUI(level) {
    const v = clamp(Math.round(level * 100) / 100, -LEVEL_MAX, LEVEL_MAX);
    if (v === shownLevel) return;
    shownLevel = v;
    const pos = (LEVEL_MAX - v) / (2 * LEVEL_MAX) * 100;   // % from top
    zoomThumb.style.top = pos + '%';
    zoomFill.style.top = Math.min(pos, 50) + '%';
    zoomFill.style.height = Math.abs(pos - 50) + '%';
    for (const t of ticks) {
      const on = (v > 0 && t.v > 0 && t.v <= v + 1e-6) || (v < 0 && t.v < 0 && t.v >= v - 1e-6);
      t.el.classList.toggle('on', on);
    }
    const txt = fmtLevel(v);
    zoomNum.textContent = txt;
    zoomHit.setAttribute('aria-valuenow', String(Math.round(v * 100) / 100));
    zoomHit.setAttribute('aria-valuetext', txt);
  }
  function setLevel(v) {
    v = clamp(v, -LEVEL_MAX, LEVEL_MAX);
    if (Math.abs(v) < 0.12) v = 0;                         // soft detent at the default
    state.tZoom = zoomFromLevel(Math.round(v * 20) / 20);   // 0.05 grid, so ¼-steps add up exactly
    renderZoomUI(levelFromZoom(state.tZoom));
    hideHint();
  }

  let zoomDrag = null;
  zoomHit.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    try { zoomHit.setPointerCapture(e.pointerId); } catch (err) { /* pointer already gone */ }
    const tr = zoomThumb.getBoundingClientRect();
    const onThumb = e.clientY >= tr.top && e.clientY <= tr.bottom;
    zoomDrag = { id: e.pointerId, offset: onThumb ? e.clientY - (tr.top + tr.height / 2) : 0 };
    zoomEl.classList.add('active');
    zoomHit.focus({ preventScroll: true });
    const r = zoomHit.getBoundingClientRect();
    setLevel(LEVEL_MAX - ((e.clientY - zoomDrag.offset - r.top) / r.height) * 2 * LEVEL_MAX);
  });
  zoomHit.addEventListener('pointermove', (e) => {
    if (!zoomDrag || e.pointerId !== zoomDrag.id) return;
    const r = zoomHit.getBoundingClientRect();
    setLevel(LEVEL_MAX - ((e.clientY - zoomDrag.offset - r.top) / r.height) * 2 * LEVEL_MAX);
  });
  const endZoomDrag = (e) => {
    if (!zoomDrag || e.pointerId !== zoomDrag.id) return;
    zoomDrag = null;
    zoomEl.classList.remove('active');
  };
  zoomHit.addEventListener('pointerup', endZoomDrag);
  zoomHit.addEventListener('pointercancel', endZoomDrag);
  zoomHit.addEventListener('lostpointercapture', endZoomDrag);
  zoomHit.addEventListener('dblclick', (e) => { e.stopPropagation(); setLevel(0); });
  zoomHit.addEventListener('wheel', (e) => {
    e.preventDefault();
    setLevel(levelFromZoom(state.tZoom) - Math.sign(e.deltaY) * 0.25);
  }, { passive: false });
  zoomHit.addEventListener('keydown', (e) => {
    const cur = levelFromZoom(state.tZoom);
    const map = { ArrowUp: 0.25, ArrowRight: 0.25, ArrowDown: -0.25, ArrowLeft: -0.25, PageUp: 1, PageDown: -1 };
    let next = null;
    if (e.key in map) next = cur + map[e.key];
    else if (e.key === 'Home') next = LEVEL_MAX;
    else if (e.key === 'End') next = -LEVEL_MAX;
    else if (e.key === '0') next = 0;
    if (next === null) return;
    e.preventDefault();
    e.stopPropagation();
    setLevel(next);
  });
  renderZoomUI(0);

  function goTo(name) {
    const v = VIEWS[name];
    const cy = state.yaw;
    const ty = cy + Math.atan2(Math.sin(v.yaw - cy), Math.cos(v.yaw - cy)); // shortest way round
    tween = { y0: cy, p0: state.pitch, r0: state.roll, y1: ty, p1: v.pitch, r1: v.roll, t0: performance.now(), dur: reducedMotion ? 350 : 1150 };
    state.tZoom = 1;
    state.vYaw = state.vPitch = 0;
    if (name !== 'home') setAuto(false);
    setActive(name);
  }
  viewBtns.forEach(b => b.addEventListener('click', () => goTo(b.dataset.view)));
  autoBtn.addEventListener('click', () => { setAuto(!autoRotate); if (autoRotate) setActive(null); });

  document.querySelectorAll('.swatches button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.swatches button').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
    applyPalette(b.dataset.color);
  }));

  const pointers = new Map();
  let dragging = false, moved = false, pinchDist = 0, lastMoveT = 0;
  const pinchDistance = () => {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y) || 1;
  };

  canvas.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragging = true; moved = false;
      state.vYaw = state.vPitch = 0;
      canvas.classList.add('dragging');
    } else if (pointers.size === 2) {
      pinchDist = pinchDistance();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;

    if (pointers.size === 1) {
      if (!moved && Math.hypot(dx, dy) > 0.5) {
        moved = true;
        tween = null;
        setAuto(false);   // user started rotating → stop auto-rotation
        setActive(null);
        hideHint();
      }
      if (!moved) return;
      const k = 0.0075;
      const now = performance.now();
      const dt = Math.max((now - lastMoveT) / 1000, 1 / 240);
      lastMoveT = now;
      state.tYaw += dx * k;
      state.tPitch = clamp(state.tPitch + dy * k * 0.85, -PITCH_MAX, PITCH_MAX);
      state.vYaw = state.vYaw * 0.4 + (dx * k / dt) * 0.6;
      state.vPitch = state.vPitch * 0.4 + (dy * k * 0.85 / dt) * 0.6;
    } else if (pointers.size === 2) {
      const d = pinchDistance();
      state.tZoom = clamp(state.tZoom * (pinchDist / d), ZOOM_MIN, ZOOM_MAX);
      pinchDist = d;
      state.vYaw = state.vPitch = 0;
      hideHint();
    }
  });

  const endPointer = (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      state.vYaw = state.vPitch = 0;   // pinch → single finger: no fling
    }
    if (pointers.size === 0) {
      dragging = false;
      canvas.classList.remove('dragging');
      if (performance.now() - lastMoveT > 90) state.vYaw = state.vPitch = 0;
      const vmax = 6;
      state.vYaw = clamp(state.vYaw, -vmax, vmax);
      state.vPitch = clamp(state.vPitch, -vmax, vmax);
    }
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('lostpointercapture', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * 400 : e.deltaY;
    state.tZoom = clamp(state.tZoom * Math.exp(clamp(delta, -200, 200) * 0.0012), ZOOM_MIN, ZOOM_MAX);
    hideHint();
  }, { passive: false });

  canvas.addEventListener('dblclick', () => goTo('home'));

  window.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const map = { '1': 'front', '2': 'back', '3': 'side', '0': 'home', 'h': 'home' };
    if (map[e.key]) goTo(map[e.key]);
    else if (e.key === 'r' || e.key === 'R') setAuto(!autoRotate);
    else if (e.key === '+' || e.key === '=') state.tZoom = clamp(state.tZoom * 0.88, ZOOM_MIN, ZOOM_MAX);
    else if (e.key === '-' || e.key === '_') state.tZoom = clamp(state.tZoom / 0.88, ZOOM_MIN, ZOOM_MAX);
  });

  // ───────────────────────── Render loop ─────────────────────────
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const clock = new THREE.Clock();
  let perfFrames = 0, perfTime = 0;

  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    if (tween) {
      const p = clamp((performance.now() - tween.t0) / tween.dur, 0, 1);
      const e = ease(p);
      state.yaw = state.tYaw = tween.y0 + (tween.y1 - tween.y0) * e;
      state.pitch = state.tPitch = tween.p0 + (tween.p1 - tween.p0) * e;
      state.roll = tween.r0 + (tween.r1 - tween.r0) * e;
      if (p >= 1) tween = null;
    } else {
      if (!dragging) {
        state.tYaw += state.vYaw * dt;
        state.tPitch = clamp(state.tPitch + state.vPitch * dt, -PITCH_MAX, PITCH_MAX);
        const decay = Math.exp(-dt * 3.2);
        state.vYaw *= decay; state.vPitch *= decay;
        if (autoRotate) state.tYaw += dt * 0.32;
      }
      const f = 1 - Math.exp(-dt * 14);
      state.yaw += (state.tYaw - state.yaw) * f;
      state.pitch += (state.tPitch - state.pitch) * f;
    }
    state.zoom += (state.tZoom - state.zoom) * (1 - Math.exp(-dt * 9));
    if (!zoomDrag) renderZoomUI(levelFromZoom(state.tZoom));   // reflect wheel / pinch / view resets

    // Keep angles bounded without visible jumps.
    if (Math.abs(state.yaw) > 1000 && !tween) {
      const off = Math.round(state.yaw / (Math.PI * 2)) * Math.PI * 2;
      state.yaw -= off; state.tYaw -= off;
    }

    phone.rotation.set(state.pitch, state.yaw, 0, 'XYZ');
    pivot.position.y = reducedMotion ? 0 : Math.sin(t * 0.8) * 1.4;
    pivot.rotation.z = state.roll;

    // Zoommer lighting cross-fade (~0.8 s, matching the backdrop).
    if (themeLight.mix !== themeLight.target) {
      const d = themeLight.target - themeLight.mix;
      themeLight.mix = Math.abs(d) < 0.002 || reducedMotion ? themeLight.target : themeLight.mix + d * (1 - Math.exp(-dt * 4.2));
      const m = themeLight.mix;
      zHemi.intensity = 0.45 * m;
      zWarmL.intensity = 1.7 * m;
      zWarmR.intensity = 1.0 * m;
      rim.intensity = RIM_BASE * (1 - 0.5 * m);
    }
    if (currentTheme === 'zoommer' && !reducedMotion) {
      const f = 1 - Math.exp(-dt * 3);
      const nx = parallax.x + (parallax.tx - parallax.x) * f;
      const ny = parallax.y + (parallax.ty - parallax.y) * f;
      if (Math.abs(nx - parallax.x) + Math.abs(ny - parallax.y) > 0.0005) {
        parallax.x = nx; parallax.y = ny;
        zenvEl.style.setProperty('--px', nx.toFixed(4));
        zenvEl.style.setProperty('--py', ny.toFixed(4));
      }
    }

    const dist = baseDist * state.zoom;
    LOOK_AT.y = -lookFactor * dist;
    const elev = 0.07;
    camera.position.set(LOOK_AT.x, LOOK_AT.y + Math.sin(elev) * dist, Math.cos(elev) * dist);
    camera.lookAt(LOOK_AT);

    updateShadow();
    renderer.render(scene, camera);

    // Adaptive resolution: step the pixel ratio down if the GPU can't keep up.
    perfFrames++; perfTime += dt;
    if (perfFrames >= 90) {
      const avg = perfTime / perfFrames;
      if (avg > 1 / 40 && pixelRatio > 1) {
        pixelRatio = Math.max(1, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight, false);
      }
      perfFrames = 0; perfTime = 0;
    }
  }

  await step('შეიდერების კომპილაცია…');
  camera.position.set(0, 0, baseDist);
  camera.lookAt(LOOK_AT);
  try { await renderer.compileAsync(scene, camera); } catch (e) { /* falls back to compile on first render */ }

  renderer.setAnimationLoop(frame);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.__READY__ = true;
    clearTimeout(window.__loadTimer);
    loaderEl.classList.add('done');
    setTimeout(() => { loaderEl.style.display = 'none'; }, 800);
  }));
}
</script>
</body>
</html>
